services:
  jupyter-notebook:
    image: docker.io/tstuckey303/scs-analysis-jupyter:1.26
    container_name: analysis_container_jupyter
    ports:
      - "7321:8888"
    volumes:
      - "./_admin:/home/jovyan/_admin"
      - "./_data:/home/jovyan/_data"
      - "./notebooks/Jupyter_Notebooks:/home/jovyan/work/notebooks"
    restart: unless-stopped
